name: Deploy root gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: node .github/scripts/validate-static-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp index.html 404.html styles.css favicon.svg robots.txt sitemap.xml _site/
          touch _site/.nojekyll

      - name: Validate artifact
        run: node .github/scripts/validate-static-site.mjs _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
