<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    >
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#111512">
    <title>Page not found / tetizz chess lab</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="error-page">
    <a class="skip-link" href="#main-content">Skip to message</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="https://tetizz.github.io/" aria-label="tetizz chess lab home">
          <span class="brand-mark" aria-hidden="true">tz</span>
          <span class="brand-copy"><strong>tetizz</strong><span>chess lab</span></span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-github" href="https://github.com/tetizz">GitHub</a>
        </nav>
      </div>
    </header>
    <main class="error-main" id="main-content">
      <div class="shell error-inner">
        <p class="eyebrow"><span aria-hidden="true"></span> 404 / Off board</p>
        <h1>That square is empty.</h1>
        <p>The page you followed is not here. The project directory is one move back.</p>
        <a class="button button-primary" href="https://tetizz.github.io/">Return to the chess lab</a>
      </div>
    </main>
  </body>
</html>
